# PostgreSQL in all environments.
#
# A local server is provided by docker-compose.yml at the repo root:
#   docker compose up -d db
#
# Every setting can be overridden by an environment variable, and in production
# a DATABASE_URL (Heroku / DO style) takes precedence over everything here.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "class_register" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "class_register" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "class_register_development" } %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: class_register_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "class_register_production" } %>
